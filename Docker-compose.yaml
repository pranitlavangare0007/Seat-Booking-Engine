
services:
  postgres:
    image: postgres:18
    container_name: ticketBookingApp-postgres
    environment:
      POSTGRES_DB: ticketBookingApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: ticketBookingApp-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
